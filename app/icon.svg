<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111c" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>

    <!-- Emerald-to-Indigo Neural Gradient -->
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Background Ambient Glow -->
  <circle cx="64" cy="64" r="32" fill="#10b981" opacity="0.15" filter="url(#glow)" />

  <!-- Cloud / Subconscious Contour (Nube) -->
  <path 
    d="M40 76 A16 16 0 0 1 44 48 A22 22 0 0 1 82 44 A18 18 0 0 1 96 66 A14 14 0 0 1 86 86 L42 86 A14 14 0 0 1 40 76 Z" 
    fill="none" 
    stroke="url(#neuralGrad)" 
    stroke-width="4.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Neural Perception Synapse / Eye Center -->
  <ellipse cx="64" cy="66" rx="14" ry="9" fill="none" stroke="#38bdf8" stroke-width="3.5" />
  <circle cx="64" cy="66" r="4.5" fill="#10b981" filter="url(#glow)" />

  <!-- Synapse Thought Sparks -->
  <circle cx="64" cy="38" r="2.5" fill="#38bdf8" />
  <circle cx="48" cy="46" r="2" fill="#10b981" />
  <circle cx="80" cy="46" r="2" fill="#6366f1" />
</svg>
